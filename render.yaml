services:
  - type: web
    name: resume-builder-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: GEMINI_API_KEY
        sync: false # set in the Render dashboard, never commit it
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ALLOWED_ORIGINS
        sync: false # your Vercel URL, e.g. https://your-app.vercel.app
      - key: RATE_LIMIT_PER_HOUR
        value: "10"
